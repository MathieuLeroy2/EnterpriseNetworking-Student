services:
  reverse-proxy:
    image: traefik:v3.1
    container_name: ch8-traefik
    command:
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--accesslog=true"
    ports:
      - "8080:80"
      - "8088:8080"
    volumes:
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks:
      - appnet

  # Stap 2: voeg hier de intranet-backend toe.

  # Stap 4: voeg hier de helpdesk-backend toe.

  # Stap 5: voeg hier de status-backend toe.

networks:
  appnet:
    name: ch8-reverse-proxy-appnet
